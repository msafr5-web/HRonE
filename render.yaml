# Render Blueprint: deploys the HRonE API (NestJS) + Postgres.
# The web app (apps/web) is deployed separately on Vercel with Root Directory = apps/web.
services:
  - type: web
    name: hrone-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: hrone-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ACCESS_TTL_SECONDS
        value: 900
      - key: REFRESH_TTL_DAYS
        value: 30
      # Set to your Vercel URL after the first web deploy, e.g. https://hrone.vercel.app
      - key: WEB_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: "HRonE <hrone@hrone.online>"

databases:
  - name: hrone-db
    plan: free
    databaseName: hrone
    user: hrone
