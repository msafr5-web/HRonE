# Isolated deployment on a server that ALREADY runs a reverse proxy on :80/:443 (shared Caddy).
#   docker compose -p hrone -f docker-compose.shared.yml --env-file .env.production up -d --build
# - own Postgres + volume (hrone_pgdata), own private network
# - no host ports published; the shared proxy reaches api/web through the external "edge" network
#   as hrone-api:4000 and hrone-web:3000.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: HRonE
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrone -d HRonE"]
      interval: 5s
      retries: 10
    networks: [internal]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://hrone:${POSTGRES_PASSWORD}@db:5432/HRonE
      WEB_ORIGIN: https://${DOMAIN:?set DOMAIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-HRonE <hrone@hrone.online>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    networks:
      internal:
      edge:
        aliases: [hrone-api]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:4000/api
    networks:
      internal:
      edge:
        aliases: [hrone-web]

networks:
  internal:
  edge:
    external: true
    name: edge

volumes:
  pgdata:
